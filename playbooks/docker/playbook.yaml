- name: Docker
  hosts: "{{ docker_hosts | default('all:localhost') }}"
  tasks:
    - name: Check Docker apt source
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/docker.list
      register: docker_apt_source

    - name: Read Docker apt source
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/docker.list
      register: docker_apt_source_content
      when: docker_apt_source.stat.exists

    - name: Remove stale Docker apt source
      become: true
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent
      when:
        - docker_apt_source.stat.exists
        - "'/dists/forky/' in (docker_apt_source_content.content | b64decode)"

    - name: Install required system packages
      become: true
      apt:
        pkg:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - python3-pip
          - virtualenv
          - python3-setuptools
          - gnupg
        state: latest
        update_cache: true

    - name: Remove distro docker
      become: true
      apt:
        pkg:
          - docker.io
          - docker-doc
          - docker-compose
          - podman-docker
          - containerd
          - runc
        state: absent


    - name: /etc/apt/keyrings
      become: true
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Add Docker GPG apt key
      become: true
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: '0644'

    - name: Add Docker Repository
      become: true
      ansible.builtin.copy:
        content: "deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }} {{ docker_apt_suite | default(ansible_facts['distribution_release'] | lower) }} stable\n"
        dest: /etc/apt/sources.list.d/docker.list
        owner: root
        group: root
        mode: '0644'

    - name: Update apt and install docker-ce
      become: true
      apt:
        pkg:
          - docker-ce
          - docker-compose-plugin
        state: latest
        update_cache: true
