---
- name: beszel
  hosts: "{{ beszel_hosts | default('dalaran') }}"
  vars:
    beszel_service_dir: /service/beszel
    beszel_database_path: "{{ beszel_service_dir }}/beszel_data/data.db"
    beszel_tinyauth_op_vault: infra.norrs
    beszel_tinyauth_op_item: tinyauth
    beszel_smtp_default_op_vault: infra.norrs
    beszel_smtp_default_op_field: PASSWORD
    beszel_pushover_op_vault: infra.norrs
    beszel_pushover_op_item: beszel/pushover
    beszel_pushover_user_key_field: user_key
    beszel_pushover_api_token_field: api_token
    # Required private key: beszel_hostname. See private/group_vars/dalaran.yaml.
  tasks:
    - name: Check Beszel SMTP service account mapping
      ansible.builtin.assert:
        that:
          - beszel_smtp_service_account is defined
          - beszel_smtp_alias is defined
          - beszel_smtp_host is defined
          - mailserver_service_accounts is defined
          - beszel_smtp_service_account in mailserver_service_accounts
          - (mailserver_service_accounts[beszel_smtp_service_account].aliases | default([]) | selectattr('name', 'equalto', beszel_smtp_alias) | list | length) == 1
          - mailserver_service_accounts[beszel_smtp_service_account].address is defined
          - mailserver_service_accounts[beszel_smtp_service_account].op_item is defined
          - lookup('community.general.onepassword', beszel_smtp_op_item, field=beszel_smtp_op_field | default(beszel_smtp_default_op_field), vault=beszel_smtp_op_vault | default(beszel_smtp_default_op_vault), errors='ignore') | default('', true) | length > 0
        fail_msg: "Beszel SMTP is enabled, but the selected service account, alias, or 1Password credential is missing. Add it to mailserver_service_accounts, then run the mailserver playbook before Beszel."
      when: beszel_smtp_enabled | default(false) | bool

    - name: Check Beszel Pushover configuration
      ansible.builtin.assert:
        that:
          - beszel_pushover_devices is defined
          - beszel_pushover_devices | length > 0
          - beszel_pushover_priority | default(0) | int >= -1
          - beszel_pushover_priority | default(0) | int <= 1
          - lookup('community.general.onepassword', beszel_pushover_op_item, field=beszel_pushover_user_key_field, vault=beszel_pushover_op_vault, errors='ignore') | default('', true) | length > 0
          - lookup('community.general.onepassword', beszel_pushover_op_item, field=beszel_pushover_api_token_field, vault=beszel_pushover_op_vault, errors='ignore') | default('', true) | length > 0
        fail_msg: "Beszel Pushover is enabled, but devices, priority, or the 1Password item 'beszel/pushover' with fields 'user_key' and 'api_token' is missing or invalid."
      when: beszel_pushover_enabled | default(false) | bool

    - name: "{{ beszel_service_dir }}"
      become: true
      ansible.builtin.file:
        path: "{{ beszel_service_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create beszel service directories
      become: true
      ansible.builtin.file:
        path: "{{ beszel_service_dir }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - beszel_data
        - beszel_socket

    - name: "{{ beszel_service_dir }}/compose.yaml"
      become: true
      ansible.builtin.template:
        src: files/beszel/compose.yaml
        dest: "{{ beszel_service_dir }}/compose.yaml"
        owner: root
        group: root
        mode: '0640'
      register: beszel_compose

    - name: "{{ beszel_nginx_vhost_dir | default('/service/nginx-proxy/vhost.d') }}"
      become: true
      ansible.builtin.file:
        path: "{{ beszel_nginx_vhost_dir | default('/service/nginx-proxy/vhost.d') }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: beszel_tinyauth_enabled | default(false) | bool

    - name: Render Beszel nginx-proxy vhost snippet
      become: true
      ansible.builtin.template:
        src: files/beszel/beszel-vhost.conf.j2
        dest: "{{ beszel_nginx_vhost_dir | default('/service/nginx-proxy/vhost.d') }}/{{ beszel_hostname }}"
        owner: root
        group: root
        mode: '0644'
      register: beszel_vhost
      when: beszel_tinyauth_enabled | default(false) | bool

    - name: Render Beszel nginx-proxy location snippet
      become: true
      ansible.builtin.template:
        src: files/beszel/beszel-location.conf.j2
        dest: "{{ beszel_nginx_vhost_dir | default('/service/nginx-proxy/vhost.d') }}/{{ beszel_hostname }}_location"
        owner: root
        group: root
        mode: '0644'
      register: beszel_vhost_location
      when: beszel_tinyauth_enabled | default(false) | bool

    - name: Render Beszel agent-connect nginx-proxy location snippet
      become: true
      ansible.builtin.template:
        src: files/beszel/beszel-agent-connect-location.conf.j2
        dest: "{{ beszel_nginx_vhost_dir | default('/service/nginx-proxy/vhost.d') }}/{{ beszel_hostname }}_{{ '/api/beszel/agent-connect' | hash('sha1') }}_location"
        owner: root
        group: root
        mode: '0644'
      register: beszel_agent_connect_vhost_location
      when: beszel_tinyauth_enabled | default(false) | bool

    - name: /etc/systemd/system/beszel.service
      become: true
      ansible.builtin.template:
        src: files/beszel.service
        dest: /etc/systemd/system/beszel.service
        owner: root
        group: root
        mode: '0644'
      when: ansible_facts['service_mgr'] == 'systemd'
      register: beszel_unit

    - name: Reload systemd
      become: true
      ansible.builtin.systemd:
        daemon_reload: true
      when: beszel_unit.changed

    - name: Restart beszel when config changed
      become: true
      ansible.builtin.systemd:
        state: restarted
        name: beszel
      when: beszel_unit.changed or beszel_compose.changed

    - name: Test nginx-proxy config after Beszel vhost changes
      become: true
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - nginx-proxy
          - nginx
          - -t
      changed_when: false
      when: >
        not ansible_check_mode
        and
        beszel_tinyauth_enabled | default(false) | bool
        and (
          (beszel_vhost is defined and beszel_vhost.changed)
          or (beszel_vhost_location is defined and beszel_vhost_location.changed)
          or (beszel_agent_connect_vhost_location is defined and beszel_agent_connect_vhost_location.changed)
        )

    - name: Reload nginx-proxy config after Beszel vhost changes
      become: true
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - nginx-proxy
          - nginx
          - -s
          - reload
      when: >
        not ansible_check_mode
        and
        beszel_tinyauth_enabled | default(false) | bool
        and (
          (beszel_vhost is defined and beszel_vhost.changed)
          or (beszel_vhost_location is defined and beszel_vhost_location.changed)
          or (beszel_agent_connect_vhost_location is defined and beszel_agent_connect_vhost_location.changed)
        )

    - name: Make sure beszel is running
      become: true
      ansible.builtin.systemd:
        state: started
        enabled: true
        name: beszel

    - name: Read Beszel OIDC client credentials from 1Password
      ansible.builtin.set_fact:
        beszel_tinyauth_client_id: "{{ lookup('community.general.onepassword', beszel_tinyauth_op_item, field='BESZEL_CLIENT_ID', vault=beszel_tinyauth_op_vault, errors='ignore') | default('', true) }}"
        beszel_tinyauth_client_secret: "{{ lookup('community.general.onepassword', beszel_tinyauth_op_item, field='BESZEL_CLIENT_SECRET', vault=beszel_tinyauth_op_vault, errors='ignore') | default('', true) }}"
      no_log: true

    - name: Skip Beszel OIDC provider config until TinyAuth client credentials exist
      ansible.builtin.debug:
        msg: "Skipping Beszel OIDC provider config: BESZEL_CLIENT_ID and BESZEL_CLIENT_SECRET are missing from the 1Password item 'tinyauth'."
      when: beszel_tinyauth_client_id | length == 0 or beszel_tinyauth_client_secret | length == 0

    - name: Install sqlite3 for Beszel PocketBase configuration
      become: true
      ansible.builtin.package:
        name: sqlite3
        state: present
      when: (beszel_smtp_enabled | default(false) | bool) or (beszel_pushover_enabled | default(false) | bool) or (beszel_tinyauth_client_id | length > 0 and beszel_tinyauth_client_secret | length > 0)

    - name: Wait for Beszel PocketBase database
      become: true
      ansible.builtin.wait_for:
        path: "{{ beszel_database_path }}"
        timeout: 60
      when: (beszel_smtp_enabled | default(false) | bool) or (beszel_pushover_enabled | default(false) | bool) or (beszel_tinyauth_client_id | length > 0 and beszel_tinyauth_client_secret | length > 0)

    - name: Wait for Beszel PocketBase settings
      become: true
      ansible.builtin.command:
        argv:
          - sqlite3
          - "{{ beszel_database_path }}"
          - "SELECT count(*) FROM _params WHERE id = 'settings';"
      register: beszel_settings_row
      changed_when: false
      retries: 12
      delay: 5
      until: beszel_settings_row.rc == 0 and (beszel_settings_row.stdout | trim) == '1'
      when: (beszel_smtp_enabled | default(false) | bool) or (beszel_pushover_enabled | default(false) | bool)

    - name: Check Beszel SMTP config
      become: true
      ansible.builtin.command:
        argv:
          - sqlite3
          - "{{ beszel_database_path }}"
      args:
        stdin: |
          WITH expected(raw) AS (
            VALUES(json('{{ {
              "smtp": {
                "enabled": true,
                "host": beszel_smtp_host,
                "port": beszel_smtp_port | default(465) | int,
                "username": beszel_smtp_user,
                "password": lookup("community.general.onepassword", beszel_smtp_op_item, field=beszel_smtp_op_field | default(beszel_smtp_default_op_field), vault=beszel_smtp_op_vault | default(beszel_smtp_default_op_vault)) | trim,
                "authMethod": beszel_smtp_auth_method | default("PLAIN"),
                "tls": beszel_smtp_tls | default(true) | bool,
                "localName": beszel_smtp_local_name | default("")
              },
              "meta": {
                "senderName": beszel_smtp_sender_name | default("Beszel"),
                "senderAddress": beszel_smtp_from
              }
            } | to_json | replace("'", "''") }}'))
          )
          SELECT CASE
            WHEN NOT EXISTS (SELECT 1 FROM _params WHERE id = 'settings') THEN 'missing'
            WHEN (SELECT json_valid(value) FROM _params WHERE id = 'settings') = 0 THEN 'not-json'
            WHEN EXISTS (
              SELECT 1
              FROM _params
              WHERE id = 'settings'
                AND json_extract(value, '$.smtp.enabled') = json_extract((SELECT raw FROM expected), '$.smtp.enabled')
                AND json_extract(value, '$.smtp.host') = json_extract((SELECT raw FROM expected), '$.smtp.host')
                AND json_extract(value, '$.smtp.port') = json_extract((SELECT raw FROM expected), '$.smtp.port')
                AND json_extract(value, '$.smtp.username') = json_extract((SELECT raw FROM expected), '$.smtp.username')
                AND json_extract(value, '$.smtp.password') = json_extract((SELECT raw FROM expected), '$.smtp.password')
                AND json_extract(value, '$.smtp.authMethod') = json_extract((SELECT raw FROM expected), '$.smtp.authMethod')
                AND json_extract(value, '$.smtp.tls') = json_extract((SELECT raw FROM expected), '$.smtp.tls')
                AND json_extract(value, '$.smtp.localName') = json_extract((SELECT raw FROM expected), '$.smtp.localName')
                AND json_extract(value, '$.meta.senderName') = json_extract((SELECT raw FROM expected), '$.meta.senderName')
                AND json_extract(value, '$.meta.senderAddress') = json_extract((SELECT raw FROM expected), '$.meta.senderAddress')
            )
            THEN 'ok'
            ELSE 'changed'
          END;
      register: beszel_smtp_config_needed
      changed_when: false
      failed_when: beszel_smtp_config_needed.rc != 0 or (beszel_smtp_config_needed.stdout | trim) in ['missing', 'not-json']
      when: beszel_smtp_enabled | default(false) | bool
      no_log: true

    - name: Stop Beszel before PocketBase SMTP config update
      become: true
      ansible.builtin.systemd:
        state: stopped
        name: beszel
      when:
        - beszel_smtp_config_needed is not skipped
        - (beszel_smtp_config_needed.stdout | trim) == 'changed'

    - name: Configure Beszel PocketBase SMTP settings
      become: true
      ansible.builtin.command:
        argv:
          - sqlite3
          - "{{ beszel_database_path }}"
      args:
        stdin: |
          WITH expected(raw) AS (
            VALUES(json('{{ {
              "smtp": {
                "enabled": true,
                "host": beszel_smtp_host,
                "port": beszel_smtp_port | default(465) | int,
                "username": beszel_smtp_user,
                "password": lookup("community.general.onepassword", beszel_smtp_op_item, field=beszel_smtp_op_field | default(beszel_smtp_default_op_field), vault=beszel_smtp_op_vault | default(beszel_smtp_default_op_vault)) | trim,
                "authMethod": beszel_smtp_auth_method | default("PLAIN"),
                "tls": beszel_smtp_tls | default(true) | bool,
                "localName": beszel_smtp_local_name | default("")
              },
              "meta": {
                "senderName": beszel_smtp_sender_name | default("Beszel"),
                "senderAddress": beszel_smtp_from
              }
            } | to_json | replace("'", "''") }}'))
          )
          UPDATE _params
          SET value = json_set(
                value,
                '$.smtp',
                json(json_extract((SELECT raw FROM expected), '$.smtp')),
                '$.meta.senderName',
                json_extract((SELECT raw FROM expected), '$.meta.senderName'),
                '$.meta.senderAddress',
                json_extract((SELECT raw FROM expected), '$.meta.senderAddress')
              ),
              updated = strftime('%Y-%m-%d %H:%M:%fZ', 'now')
          WHERE id = 'settings';
      when:
        - beszel_smtp_config_needed is not skipped
        - (beszel_smtp_config_needed.stdout | trim) == 'changed'
      no_log: true

    - name: Start Beszel after PocketBase SMTP config update
      become: true
      ansible.builtin.systemd:
        state: started
        enabled: true
        name: beszel
      when:
        - beszel_smtp_config_needed is not skipped
        - (beszel_smtp_config_needed.stdout | trim) == 'changed'

    - name: Wait for Beszel users collection
      become: true
      ansible.builtin.command:
        argv:
          - sqlite3
          - "{{ beszel_database_path }}"
          - "SELECT count(*) FROM _collections WHERE name = 'users' AND type = 'auth';"
      register: beszel_users_collection
      changed_when: false
      retries: 12
      delay: 5
      until: beszel_users_collection.rc == 0 and (beszel_users_collection.stdout | trim) == '1'
      when: (beszel_pushover_enabled | default(false) | bool) or (beszel_tinyauth_client_id | length > 0 and beszel_tinyauth_client_secret | length > 0)

    - name: Wait for Beszel user settings collection
      become: true
      ansible.builtin.command:
        argv:
          - sqlite3
          - "{{ beszel_database_path }}"
          - "SELECT count(*) FROM _collections WHERE name = 'user_settings';"
      register: beszel_user_settings_collection
      changed_when: false
      retries: 12
      delay: 5
      until: beszel_user_settings_collection.rc == 0 and (beszel_user_settings_collection.stdout | trim) == '1'
      when: beszel_pushover_enabled | default(false) | bool

    - name: Read Beszel Pushover credentials from 1Password
      ansible.builtin.set_fact:
        beszel_pushover_user_key: "{{ lookup('community.general.onepassword', beszel_pushover_op_item, field=beszel_pushover_user_key_field, vault=beszel_pushover_op_vault) | trim }}"
        beszel_pushover_api_token: "{{ lookup('community.general.onepassword', beszel_pushover_op_item, field=beszel_pushover_api_token_field, vault=beszel_pushover_op_vault) | trim }}"
      no_log: true
      when: beszel_pushover_enabled | default(false) | bool

    - name: Build Beszel Pushover notification URL
      ansible.builtin.set_fact:
        beszel_pushover_url: "pushover://shoutrrr:{{ beszel_pushover_api_token }}@{{ beszel_pushover_user_key }}/?devices={{ beszel_pushover_devices | join(',') }}{% if beszel_pushover_priority is defined %}&priority={{ beszel_pushover_priority | int }}{% endif %}"
      no_log: true
      when: beszel_pushover_enabled | default(false) | bool

    - name: Find Beszel Pushover notification user
      become: true
      ansible.builtin.command:
        argv:
          - sqlite3
          - "{{ beszel_database_path }}"
      args:
        stdin: |
          SELECT id
          FROM users
          WHERE COALESCE(role, 'user') != 'readonly'
          {% if beszel_pushover_user_email is defined and beszel_pushover_user_email | length > 0 %}
            AND lower(email) = lower('{{ beszel_pushover_user_email | replace("'", "''") }}')
          {% endif %}
          ORDER BY CASE role WHEN 'admin' THEN 0 ELSE 1 END, created
          LIMIT 1;
      register: beszel_pushover_user
      changed_when: false
      when: beszel_pushover_enabled | default(false) | bool

    - name: Skip Beszel Pushover config until a notification user exists
      ansible.builtin.debug:
        msg: "Skipping Beszel Pushover config: no matching non-readonly Beszel user exists yet. Log in to Beszel once, or set beszel_pushover_user_email to an existing user."
      when:
        - beszel_pushover_enabled | default(false) | bool
        - beszel_pushover_user.stdout | trim | length == 0

    - name: Ensure Beszel Pushover user settings record
      become: true
      ansible.builtin.command:
        argv:
          - sqlite3
          - "{{ beszel_database_path }}"
      args:
        stdin: |
          INSERT OR IGNORE INTO user_settings (id, user, settings, created, updated)
          VALUES (
            '{{ lookup("community.general.random_string", length=15, override_all="abcdefghijklmnopqrstuvwxyz0123456789") }}',
            '{{ beszel_pushover_user.stdout | trim }}',
            json('{"chartTime":"1h","emails":[],"webhooks":[]}'),
            strftime('%Y-%m-%d %H:%M:%fZ', 'now'),
            strftime('%Y-%m-%d %H:%M:%fZ', 'now')
          );
          SELECT changes();
      register: beszel_pushover_user_settings
      changed_when: (beszel_pushover_user_settings.stdout | trim) == '1'
      when:
        - beszel_pushover_enabled | default(false) | bool
        - beszel_pushover_user.stdout | trim | length > 0

    - name: Check Beszel Pushover notification URL
      become: true
      ansible.builtin.command:
        argv:
          - sqlite3
          - "{{ beszel_database_path }}"
      args:
        stdin: |
          WITH expected(url) AS (
            VALUES('{{ beszel_pushover_url | replace("'", "''") }}')
          )
          SELECT CASE
            WHEN EXISTS (
              SELECT 1
              FROM user_settings,
                   json_each(COALESCE(json_extract(settings, '$.webhooks'), json('[]')))
              WHERE user = '{{ beszel_pushover_user.stdout | trim }}'
                AND value = (SELECT url FROM expected)
            )
            THEN 0
            ELSE 1
          END;
      register: beszel_pushover_config_needed
      changed_when: false
      when:
        - beszel_pushover_enabled | default(false) | bool
        - beszel_pushover_user.stdout | trim | length > 0
      no_log: true

    - name: Configure Beszel Pushover notification URL
      become: true
      ansible.builtin.command:
        argv:
          - sqlite3
          - "{{ beszel_database_path }}"
      args:
        stdin: |
          WITH expected(url) AS (
            VALUES('{{ beszel_pushover_url | replace("'", "''") }}')
          )
          UPDATE user_settings
          SET settings = json_set(
                COALESCE(NULLIF(settings, ''), '{}'),
                '$.webhooks',
                json_insert(
                  COALESCE(json_extract(settings, '$.webhooks'), json('[]')),
                  '$[#]',
                  (SELECT url FROM expected)
                )
              ),
              updated = strftime('%Y-%m-%d %H:%M:%fZ', 'now')
          WHERE user = '{{ beszel_pushover_user.stdout | trim }}'
            AND NOT EXISTS (
              SELECT 1
              FROM json_each(COALESCE(json_extract(settings, '$.webhooks'), json('[]')))
              WHERE value = (SELECT url FROM expected)
            );
      when:
        - beszel_pushover_config_needed is not skipped
        - (beszel_pushover_config_needed.stdout | trim) == '1'
      no_log: true

    - name: Check Beszel OIDC provider config
      become: true
      ansible.builtin.command:
        argv:
          - sqlite3
          - "{{ beszel_database_path }}"
      args:
        stdin: |
          WITH expected(raw) AS (
            VALUES(json('{{ {
              "name": "oidc",
              "clientId": beszel_tinyauth_client_id,
              "clientSecret": beszel_tinyauth_client_secret,
              "authURL": "https://" ~ tinyauth_hostname ~ "/authorize",
              "tokenURL": "https://" ~ tinyauth_hostname ~ "/api/oidc/token",
              "userInfoURL": "https://" ~ tinyauth_hostname ~ "/api/oidc/userinfo",
              "displayName": "Tinyauth",
              "pkce": true
            } | to_json | replace("'", "''") }}'))
          )
          SELECT CASE
            WHEN EXISTS (
              SELECT 1
              FROM _collections,
                   json_each(COALESCE(json_extract(options, '$.oauth2.providers'), json('[]')))
              WHERE _collections.name = 'users'
                AND _collections.type = 'auth'
                AND json_extract(options, '$.oauth2.enabled') = 1
                AND json_extract(value, '$.name') = json_extract((SELECT raw FROM expected), '$.name')
                AND json_extract(value, '$.clientId') = json_extract((SELECT raw FROM expected), '$.clientId')
                AND json_extract(value, '$.clientSecret') = json_extract((SELECT raw FROM expected), '$.clientSecret')
                AND json_extract(value, '$.authURL') = json_extract((SELECT raw FROM expected), '$.authURL')
                AND json_extract(value, '$.tokenURL') = json_extract((SELECT raw FROM expected), '$.tokenURL')
                AND json_extract(value, '$.userInfoURL') = json_extract((SELECT raw FROM expected), '$.userInfoURL')
                AND json_extract(value, '$.displayName') = json_extract((SELECT raw FROM expected), '$.displayName')
                AND json_extract(value, '$.pkce') = json_extract((SELECT raw FROM expected), '$.pkce')
            )
            THEN 0
            ELSE 1
          END;
      register: beszel_oidc_config_needed
      changed_when: false
      when: beszel_tinyauth_client_id | length > 0 and beszel_tinyauth_client_secret | length > 0
      no_log: true

    - name: Stop Beszel before PocketBase OIDC config update
      become: true
      ansible.builtin.systemd:
        state: stopped
        name: beszel
      when:
        - beszel_oidc_config_needed is not skipped
        - (beszel_oidc_config_needed.stdout | trim) == '1'

    - name: Configure Beszel PocketBase OIDC provider
      become: true
      ansible.builtin.command:
        argv:
          - sqlite3
          - "{{ beszel_database_path }}"
      args:
        stdin: |
          WITH provider(raw) AS (
            VALUES(json('{{ {
              "name": "oidc",
              "clientId": beszel_tinyauth_client_id,
              "clientSecret": beszel_tinyauth_client_secret,
              "authURL": "https://" ~ tinyauth_hostname ~ "/authorize",
              "tokenURL": "https://" ~ tinyauth_hostname ~ "/api/oidc/token",
              "userInfoURL": "https://" ~ tinyauth_hostname ~ "/api/oidc/userinfo",
              "displayName": "Tinyauth",
              "pkce": true
            } | to_json | replace("'", "''") }}'))
          ),
          filtered(providers) AS (
            SELECT COALESCE(json_group_array(json(value)), json('[]'))
            FROM _collections,
                 json_each(COALESCE(json_extract(options, '$.oauth2.providers'), json('[]')))
            WHERE _collections.name = 'users'
              AND _collections.type = 'auth'
              AND json_extract(value, '$.name') != json_extract((SELECT raw FROM provider), '$.name')
          )
          UPDATE _collections
          SET options = json_set(
                COALESCE(NULLIF(options, ''), '{}'),
                '$.oauth2.enabled',
                json('true'),
                '$.oauth2.providers',
                json_insert((SELECT providers FROM filtered), '$[#]', json((SELECT raw FROM provider)))
              ),
              updated = strftime('%Y-%m-%d %H:%M:%fZ', 'now')
          WHERE name = 'users'
            AND type = 'auth';
      when:
        - beszel_oidc_config_needed is not skipped
        - (beszel_oidc_config_needed.stdout | trim) == '1'
      no_log: true

    - name: Start Beszel after PocketBase OIDC config update
      become: true
      ansible.builtin.systemd:
        state: started
        enabled: true
        name: beszel
      when:
        - beszel_oidc_config_needed is not skipped
        - (beszel_oidc_config_needed.stdout | trim) == '1'
