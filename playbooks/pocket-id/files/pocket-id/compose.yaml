services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    container_name: pocket-id
    restart: unless-stopped
    env_file: .env
    environment:
      VIRTUAL_HOST: "{{ pocket_id_hostname }}"
      VIRTUAL_PORT: "1411"
      ACME_HOST: "{{ pocket_id_hostname }}"
      LETSENCRYPT_HOST: "{{ pocket_id_hostname }}"
    expose:
      - "1411"
    volumes:
      - ./data:/app/data
      - ./encryption_key:/run/secrets/pocket_id_encryption_key:ro
{% if pocket_id_smtp_enabled | default(false) | bool %}
      - ./smtp_password:{{ pocket_id_smtp_secret_container_path }}:ro
{% endif %}
    networks:
      - webservers

networks:
  webservers:
    external: true
    name: webservers
