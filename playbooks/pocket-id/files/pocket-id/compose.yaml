services:
  pocket-id:
    image: {{ pocket_id_image | default(pocket_id_default_image) }}
    container_name: pocket-id
    restart: unless-stopped
    env_file: .env
    labels:
      - 'diun.enable=true'
      - 'diun.watch_repo=true'
      - 'diun.include_tags=^v[0-9]+\.[0-9]+\.[0-9]+$'
      - 'diun.sort_tags=semver'
      - 'diun.max_tags=5'
    environment:
      VIRTUAL_HOST: "{{ pocket_id_hostname }}"
      VIRTUAL_PORT: "1411"
      ACME_HOST: "{{ pocket_id_hostname }}"
      LETSENCRYPT_HOST: "{{ pocket_id_hostname }}"
    expose:
      - "1411"
    volumes:
      - ./data:/app/data
      - ./encryption_key:/run/secrets/pocket_id_encryption_key:ro
{% if pocket_id_smtp_enabled | default(false) | bool %}
      - ./smtp_password:{{ pocket_id_smtp_secret_container_path }}:ro
{% endif %}
    networks:
      - webservers

networks:
  webservers:
    external: true
    name: webservers
