---
- name: rtorrent-rutorrent
  hosts: "{{ rtorrent_rutorrent_hosts | default('all') }}"
  tasks:
    - name: Set rTorrent/ruTorrent defaults
      ansible.builtin.set_fact:
        rtorrent_rutorrent_service_dir: "{{ rtorrent_rutorrent_service_dir | default('/service/rtorrent-rutorrent') }}"
        rtorrent_rutorrent_image: "{{ rtorrent_rutorrent_image | default('crazymax/rtorrent-rutorrent:latest') }}"
        rtorrent_rutorrent_geoip_image: "{{ rtorrent_rutorrent_geoip_image | default('crazymax/geoip-updater:latest') }}"
        rtorrent_rutorrent_logs_image: "{{ rtorrent_rutorrent_logs_image | default('bash') }}"
        rtorrent_rutorrent_network_name: "{{ rtorrent_rutorrent_network_name | default('rtorrent-rutorrent') }}"
        rtorrent_rutorrent_web_network_name: "{{ rtorrent_rutorrent_web_network_name | default('webservers') }}"
        rtorrent_rutorrent_web_hostname: "{{ rtorrent_rutorrent_web_hostname | default('') }}"
        rtorrent_rutorrent_web_aliases: "{{ rtorrent_rutorrent_web_aliases | default([]) }}"
        rtorrent_rutorrent_auth_provider: "{{ rtorrent_rutorrent_auth_provider | default('tinyauth' if (rtorrent_rutorrent_tinyauth_enabled | default(false) | bool) else ('oauth2-proxy' if (rtorrent_rutorrent_oauth2_proxy_enabled | default(false) | bool) else 'none')) }}"
        rtorrent_rutorrent_tinyauth_internal_url: "{{ rtorrent_rutorrent_tinyauth_internal_url | default('http://tinyauth:3000') }}"
        rtorrent_rutorrent_tinyauth_hostname: "{{ rtorrent_rutorrent_tinyauth_hostname | default(tinyauth_hostname | default(oauth2_proxy_hostname | default(''))) }}"
        rtorrent_rutorrent_oauth2_proxy_internal_url: "{{ rtorrent_rutorrent_oauth2_proxy_internal_url | default('http://oauth2-proxy:4180') }}"
        rtorrent_rutorrent_oauth2_proxy_allowed_groups: "{{ rtorrent_rutorrent_oauth2_proxy_allowed_groups | default('') }}"
        rtorrent_rutorrent_nginx_vhost_dir: "{{ rtorrent_rutorrent_nginx_vhost_dir | default('/service/nginx-proxy/vhost.d') }}"
        rtorrent_rutorrent_publish_rutorrent_port: "{{ rtorrent_rutorrent_publish_rutorrent_port | default(true) }}"
        rtorrent_rutorrent_timezone: "{{ rtorrent_rutorrent_timezone | default('Europe/Oslo') }}"
        rtorrent_rutorrent_puid: "{{ rtorrent_rutorrent_puid | default(1000) }}"
        rtorrent_rutorrent_pgid: "{{ rtorrent_rutorrent_pgid | default(1000) }}"
        rtorrent_rutorrent_ports: "{{ rtorrent_rutorrent_ports | default({'dht': 6881, 'xmlrpc': 8000, 'rutorrent': 8080, 'webdav': 9000, 'incoming': 50000}) }}"
        rtorrent_rutorrent_volumes: "{{ rtorrent_rutorrent_volumes | default([]) }}"
        rtorrent_rutorrent_storage_pools: "{{ rtorrent_rutorrent_storage_pools | default([]) }}"
        rtorrent_rutorrent_delete_guard_enabled: "{{ rtorrent_rutorrent_delete_guard_enabled | default(false) }}"
        rtorrent_rutorrent_legacy_delete_roots: "{{ rtorrent_rutorrent_legacy_delete_roots | default([]) }}"
        rtorrent_rutorrent_media_pruner_backups: "{{ rtorrent_rutorrent_media_pruner_backups | default('') }}"
        rtorrent_rutorrent_config_path: "{{ rtorrent_rutorrent_config_path | default('') }}"
        rtorrent_rutorrent_media_network_enabled: "{{ rtorrent_rutorrent_media_network_enabled | default(false) }}"
        rtorrent_rutorrent_media_network_name: "{{ rtorrent_rutorrent_media_network_name | default('media_internal') }}"
        rtorrent_rutorrent_geoip_volume: "{{ rtorrent_rutorrent_geoip_volume | default('./data/geoip:/data') }}"
        rtorrent_rutorrent_log_volume: "{{ rtorrent_rutorrent_log_volume | default('./data/rtorrent/log:/log') }}"
        rtorrent_rutorrent_geoip_enabled: "{{ rtorrent_rutorrent_geoip_enabled | default(true) }}"
        rtorrent_rutorrent_geoip_edition_ids: "{{ rtorrent_rutorrent_geoip_edition_ids | default('GeoLite2-City,GeoLite2-Country') }}"
        rtorrent_rutorrent_geoip_download_path: "{{ rtorrent_rutorrent_geoip_download_path | default('/data') }}"
        rtorrent_rutorrent_geoip_schedule: "{{ rtorrent_rutorrent_geoip_schedule | default('0 0 * * 0') }}"
        rtorrent_rutorrent_geoip_log_level: "{{ rtorrent_rutorrent_geoip_log_level | default('info') }}"
        rtorrent_rutorrent_geoip_log_json: "{{ rtorrent_rutorrent_geoip_log_json | default('false') }}"
        rtorrent_rutorrent_geoip_op_vault: "{{ rtorrent_rutorrent_geoip_op_vault | default('infra.norrs') }}"
        rtorrent_rutorrent_geoip_op_item: "{{ rtorrent_rutorrent_geoip_op_item | default('rtorrent-rutorrent/geoip-updater') }}"
        rtorrent_rutorrent_geoip_license_key_field: "{{ rtorrent_rutorrent_geoip_license_key_field | default('license_key') }}"
        rtorrent_rutorrent_env: "{{ rtorrent_rutorrent_env | default({}) }}"

    - name: Set ruTorrent web hostnames
      ansible.builtin.set_fact:
        rtorrent_rutorrent_web_hostnames: "{{ ([rtorrent_rutorrent_web_hostname] + rtorrent_rutorrent_web_aliases) | reject('equalto', '') | unique | list }}"

    - name: Validate ruTorrent auth configuration
      ansible.builtin.assert:
        that:
          - rtorrent_rutorrent_auth_provider in ['none', 'tinyauth', 'oauth2-proxy']
          - rtorrent_rutorrent_auth_provider == 'none' or rtorrent_rutorrent_web_hostnames | length > 0
          - rtorrent_rutorrent_auth_provider != 'tinyauth' or rtorrent_rutorrent_tinyauth_hostname | length > 0
          - rtorrent_rutorrent_auth_provider != 'oauth2-proxy' or oauth2_proxy_hostname | default('') | length > 0
        fail_msg: "Set rtorrent_rutorrent_auth_provider to one of none, tinyauth, or oauth2-proxy, and configure web/auth hostnames for the selected provider."

    - name: Set ruTorrent auth enabled state
      ansible.builtin.set_fact:
        rtorrent_rutorrent_auth_enabled: "{{ rtorrent_rutorrent_auth_provider != 'none' }}"

    - name: Initialize rTorrent/ruTorrent secrets
      ansible.builtin.set_fact:
        rtorrent_rutorrent_geoip_license_key: ""

    - name: Read GeoIP license key from 1Password
      ansible.builtin.set_fact:
        rtorrent_rutorrent_geoip_license_key: "{{ lookup('community.general.onepassword', rtorrent_rutorrent_geoip_op_item, field=rtorrent_rutorrent_geoip_license_key_field, vault=rtorrent_rutorrent_geoip_op_vault, errors='ignore') | default('', true) | trim }}"
      no_log: true
      when: rtorrent_rutorrent_geoip_enabled | bool

    - name: Inspect existing GeoIP environment as a deployment fallback
      become: true
      ansible.builtin.stat:
        path: "{{ rtorrent_rutorrent_service_dir }}/geoip-updater.env"
      register: rtorrent_rutorrent_existing_geoip_env_stat
      when:
        - rtorrent_rutorrent_geoip_enabled | bool
        - rtorrent_rutorrent_geoip_license_key | length == 0

    - name: Read existing GeoIP environment as a deployment fallback
      become: true
      ansible.builtin.slurp:
        src: "{{ rtorrent_rutorrent_service_dir }}/geoip-updater.env"
      register: rtorrent_rutorrent_existing_geoip_env
      no_log: true
      when:
        - rtorrent_rutorrent_geoip_enabled | bool
        - rtorrent_rutorrent_geoip_license_key | length == 0
        - rtorrent_rutorrent_existing_geoip_env_stat.stat.exists

    - name: Reuse the existing GeoIP license key when 1Password is unavailable
      ansible.builtin.set_fact:
        rtorrent_rutorrent_geoip_license_key: >-
          {{
            (
              (rtorrent_rutorrent_existing_geoip_env.content | b64decode)
              | regex_findall('(?m)^LICENSE_KEY=(.+)$')
              | first
              | default('')
            ) | trim
          }}
      no_log: true
      when:
        - rtorrent_rutorrent_existing_geoip_env is defined
        - rtorrent_rutorrent_existing_geoip_env.content is defined

    - name: Validate GeoIP configuration
      ansible.builtin.assert:
        that:
          - not (rtorrent_rutorrent_geoip_enabled | bool) or rtorrent_rutorrent_geoip_license_key | length > 0
        fail_msg: "Missing GeoIP license key in 1Password item '{{ rtorrent_rutorrent_geoip_op_item }}' / vault '{{ rtorrent_rutorrent_geoip_op_vault }}', field '{{ rtorrent_rutorrent_geoip_license_key_field }}'."

    - name: Validate rTorrent storage pool definitions
      ansible.builtin.assert:
        that:
          - item.name | default('') | length > 0
          - item.host_path | default('') is match('^/')
          - item.container_path | default('') is match('^/pool/')
          - item.directories | default([]) | length > 0
          - item.directories | reject('match', '^[.]torrents(?:/[^/]+)?$') | list | length == 0
        fail_msg: "Each rTorrent storage pool needs a name, absolute host path, /pool/... container path, and only .torrents seed directories."
      loop: "{{ rtorrent_rutorrent_storage_pools }}"
      loop_control:
        label: "{{ item.name | default(item.host_path | default('invalid pool')) }}"

    - name: Inspect rTorrent storage pool roots
      become: true
      ansible.builtin.stat:
        path: "{{ item.host_path }}"
      register: rtorrent_rutorrent_storage_pool_stats
      loop: "{{ rtorrent_rutorrent_storage_pools }}"
      loop_control:
        label: "{{ item.host_path }}"

    - name: Validate rTorrent storage pool roots exist as directories
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
        fail_msg: "rTorrent storage pool root '{{ item.item.host_path }}' must already exist before seed directories are created."
      loop: "{{ rtorrent_rutorrent_storage_pool_stats.results }}"
      loop_control:
        label: "{{ item.item.host_path }}"

    - name: Inspect backing mounts for rTorrent storage pools
      become: true
      ansible.builtin.command:
        argv:
          - findmnt
          - --noheadings
          - --output
          - TARGET,SOURCE,FSTYPE
          - --target
          - "{{ item.host_path }}"
      check_mode: false
      changed_when: false
      failed_when: false
      register: rtorrent_rutorrent_storage_pool_mounts
      loop: "{{ rtorrent_rutorrent_storage_pools }}"
      loop_control:
        label: "{{ item.host_path }}"

    - name: Validate rTorrent storage pools are on mounted ext4 filesystems
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - item.stdout.split() | length >= 3
          - item.stdout.split()[-1] == 'ext4'
        fail_msg: "rTorrent storage pool '{{ item.item.host_path }}' must resolve to a mounted ext4 filesystem; got '{{ item.stdout | default('') }}'."
      loop: "{{ rtorrent_rutorrent_storage_pool_mounts.results }}"
      loop_control:
        label: "{{ item.item.host_path }}"

    - name: Create rTorrent Arr seed directories
      become: true
      ansible.builtin.file:
        path: "{{ item.0.host_path }}/{{ item.1 }}"
        state: directory
        owner: "{{ rtorrent_rutorrent_puid }}"
        group: "{{ rtorrent_rutorrent_pgid }}"
        mode: '2775'
      loop: "{{ query('ansible.builtin.subelements', rtorrent_rutorrent_storage_pools, 'directories', {'skip_missing': true}) }}"
      loop_control:
        label: "{{ item.0.host_path }}/{{ item.1 }}"

    - name: Build rTorrent guarded seed roots
      ansible.builtin.set_fact:
        rtorrent_rutorrent_guarded_seed_roots: >-
          {{
            rtorrent_rutorrent_guarded_seed_roots | default([])
            + [item.0.container_path ~ '/' ~ item.1]
          }}
      loop: "{{ query('ansible.builtin.subelements', rtorrent_rutorrent_storage_pools, 'directories', {'skip_missing': true}) }}"
      loop_control:
        label: "{{ item.0.container_path }}/{{ item.1 }}"
      when:
        - rtorrent_rutorrent_delete_guard_enabled | bool
        - item.1 != '.torrents'

    - name: Add explicitly allowlisted classic category roots to the deletion guard
      ansible.builtin.set_fact:
        rtorrent_rutorrent_guarded_seed_roots: >-
          {{
            rtorrent_rutorrent_guarded_seed_roots | default([])
            + rtorrent_rutorrent_legacy_delete_roots
          }}
      when: rtorrent_rutorrent_delete_guard_enabled | bool

    - name: Validate rTorrent deletion guard configuration
      ansible.builtin.assert:
        that:
          - rtorrent_rutorrent_config_path is match('^/')
          - rtorrent_rutorrent_guarded_seed_roots | default([]) | length > 0
          - rtorrent_rutorrent_legacy_delete_roots | reject('match', '^/downloads/complete/[^/]+$') | list | length == 0
          - rtorrent_rutorrent_guarded_seed_roots | default([]) | reject('match', '^(?:/pool/[^/]+/[.]torrents/[^/]+|/downloads/complete/[^/]+)$') | list | length == 0
        fail_msg: "The rTorrent deletion guard needs an absolute persisted config path and only category-specific Arr or classic roots."
      when: rtorrent_rutorrent_delete_guard_enabled | bool

    - name: "{{ rtorrent_rutorrent_service_dir }}"
      become: true
      ansible.builtin.file:
        path: "{{ rtorrent_rutorrent_service_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create rTorrent/ruTorrent service directories
      become: true
      ansible.builtin.file:
        path: "{{ rtorrent_rutorrent_service_dir }}/{{ item }}"
        state: directory
        owner: "{{ rtorrent_rutorrent_puid }}"
        group: "{{ rtorrent_rutorrent_pgid }}"
        mode: '0755'
      loop:
        - passwd

    - name: Create rTorrent guard directories
      become: true
      ansible.builtin.file:
        path: "{{ rtorrent_rutorrent_service_dir }}/{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - path: bin
          mode: '0755'
        - path: backups
          mode: '0700'
      when: rtorrent_rutorrent_delete_guard_enabled | bool

    - name: Install guarded rTorrent data deletion helper
      become: true
      ansible.builtin.template:
        src: files/rtorrent-rutorrent/rtorrent-delete-seed.j2
        dest: "{{ rtorrent_rutorrent_service_dir }}/bin/rtorrent-delete-seed"
        owner: root
        group: root
        mode: '0755'
      register: rtorrent_rutorrent_delete_guard_script
      when: rtorrent_rutorrent_delete_guard_enabled | bool

    - name: Read persisted rTorrent configuration before managing hooks
      become: true
      ansible.builtin.slurp:
        src: "{{ rtorrent_rutorrent_config_path }}"
      register: rtorrent_rutorrent_config
      when: rtorrent_rutorrent_delete_guard_enabled | bool

    - name: Validate persisted rTorrent hook configuration
      ansible.builtin.assert:
        that:
          - >-
            (
              rtorrent_rutorrent_config.content | b64decode
              | regex_findall('(?m)^(?:method[.]set_key = event[.]download[.]finished,move_complete,.*|# Ansible managed: legacy completion mover disabled; Arr imports from category-specific seed directories[.])$')
              | length
            ) == 1
          - >-
            (
              rtorrent_rutorrent_config.content | b64decode
              | regex_findall('(?m)^method[.]set_key = event[.]download[.]erased,delete_erased,.*$')
              | length
            ) == 1
        fail_msg: "Refusing to edit '{{ rtorrent_rutorrent_config_path }}': expected exactly one completion hook and one erase hook."
      when: rtorrent_rutorrent_delete_guard_enabled | bool

    - name: Back up persisted rTorrent configuration before hook migration
      become: true
      ansible.builtin.copy:
        src: "{{ rtorrent_rutorrent_config_path }}"
        dest: "{{ rtorrent_rutorrent_service_dir }}/backups/rtorrent.rc.before-arr-guard"
        remote_src: true
        force: false
        owner: root
        group: root
        mode: '0600'
      when:
        - rtorrent_rutorrent_delete_guard_enabled | bool
        - not ansible_check_mode

    - name: Disable legacy rTorrent completion mover
      become: true
      ansible.builtin.lineinfile:
        path: "{{ rtorrent_rutorrent_config_path }}"
        regexp: '^(?:method[.]set_key = event[.]download[.]finished,move_complete,.*|# Ansible managed: legacy completion mover disabled; Arr imports from category-specific seed directories[.])$'
        line: '# Ansible managed: legacy completion mover disabled; Arr imports from category-specific seed directories.'
        owner: "{{ rtorrent_rutorrent_puid }}"
        group: "{{ rtorrent_rutorrent_pgid }}"
        mode: '0644'
      register: rtorrent_rutorrent_completion_hook
      when: rtorrent_rutorrent_delete_guard_enabled | bool

    - name: Guard rTorrent erase-data hook
      become: true
      ansible.builtin.lineinfile:
        path: "{{ rtorrent_rutorrent_config_path }}"
        regexp: '^method[.]set_key = event[.]download[.]erased,delete_erased,.*$'
        line: 'method.set_key = event.download.erased,delete_erased,"execute=/usr/local/sbin/rtorrent-delete-seed,$d.data_path="'
        owner: "{{ rtorrent_rutorrent_puid }}"
        group: "{{ rtorrent_rutorrent_pgid }}"
        mode: '0644'
      register: rtorrent_rutorrent_erase_hook
      when: rtorrent_rutorrent_delete_guard_enabled | bool

    - name: Inspect rTorrent media network
      become: true
      ansible.builtin.command:
        argv:
          - docker
          - network
          - inspect
          - "{{ rtorrent_rutorrent_media_network_name }}"
      check_mode: false
      changed_when: false
      failed_when: false
      register: rtorrent_rutorrent_media_network
      when: rtorrent_rutorrent_media_network_enabled | bool

    - name: Validate existing rTorrent media network
      ansible.builtin.assert:
        that:
          - (rtorrent_rutorrent_media_network.stdout | from_json | first).Driver == 'bridge'
          - (rtorrent_rutorrent_media_network.stdout | from_json | first).Internal | bool
        fail_msg: "Existing Docker network '{{ rtorrent_rutorrent_media_network_name }}' must be an internal bridge."
      when:
        - rtorrent_rutorrent_media_network_enabled | bool
        - rtorrent_rutorrent_media_network.rc == 0

    - name: Create internal rTorrent media network
      become: true
      ansible.builtin.command:
        argv:
          - docker
          - network
          - create
          - --driver
          - bridge
          - --internal
          - "{{ rtorrent_rutorrent_media_network_name }}"
      when:
        - rtorrent_rutorrent_media_network_enabled | bool
        - rtorrent_rutorrent_media_network.rc != 0
        - not ansible_check_mode

    - name: Create empty rTorrent/ruTorrent htpasswd files
      become: true
      ansible.builtin.copy:
        content: ""
        dest: "{{ rtorrent_rutorrent_service_dir }}/passwd/{{ item }}"
        owner: "{{ rtorrent_rutorrent_puid }}"
        group: "{{ rtorrent_rutorrent_pgid }}"
        mode: '0640'
        force: false
      loop:
        - rpc.htpasswd
        - rutorrent.htpasswd
        - webdav.htpasswd

    - name: Keep rTorrent/ruTorrent htpasswd ownership readable by the container
      become: true
      ansible.builtin.file:
        path: "{{ rtorrent_rutorrent_service_dir }}/passwd/{{ item }}"
        owner: "{{ rtorrent_rutorrent_puid }}"
        group: "{{ rtorrent_rutorrent_pgid }}"
        mode: '0640'
      loop:
        - rpc.htpasswd
        - rutorrent.htpasswd
        - webdav.htpasswd

    - name: Create root-owned rTorrent container initialization directory
      become: true
      ansible.builtin.file:
        path: "{{ rtorrent_rutorrent_service_dir }}/init"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install persistent rTorrent htpasswd permission protection
      become: true
      ansible.builtin.copy:
        src: "files/rtorrent-rutorrent/{{ item }}"
        dest: "{{ rtorrent_rutorrent_service_dir }}/init/{{ item }}"
        owner: root
        group: root
        mode: '0755'
      loop:
        - 99-protect-htpasswd.sh
        - start-with-passwd-protection.sh
      register: rtorrent_rutorrent_passwd_init

    - name: "{{ rtorrent_rutorrent_service_dir }}/.env"
      become: true
      ansible.builtin.template:
        src: files/rtorrent-rutorrent/env.j2
        dest: "{{ rtorrent_rutorrent_service_dir }}/.env"
        owner: root
        group: root
        mode: '0644'
      register: rtorrent_rutorrent_ports_env

    - name: "{{ rtorrent_rutorrent_service_dir }}/rtorrent-rutorrent.env"
      become: true
      ansible.builtin.template:
        src: files/rtorrent-rutorrent/rtorrent-rutorrent.env.j2
        dest: "{{ rtorrent_rutorrent_service_dir }}/rtorrent-rutorrent.env"
        owner: root
        group: root
        mode: '0644'
      register: rtorrent_rutorrent_app_env

    - name: "{{ rtorrent_rutorrent_service_dir }}/geoip-updater.env"
      become: true
      ansible.builtin.template:
        src: files/rtorrent-rutorrent/geoip-updater.env.j2
        dest: "{{ rtorrent_rutorrent_service_dir }}/geoip-updater.env"
        owner: root
        group: root
        mode: '0640'
      register: rtorrent_rutorrent_geoip_env
      no_log: true
      when: rtorrent_rutorrent_geoip_enabled | bool

    - name: "{{ rtorrent_rutorrent_service_dir }}/compose.yaml"
      become: true
      ansible.builtin.template:
        src: files/rtorrent-rutorrent/compose.yaml
        dest: "{{ rtorrent_rutorrent_service_dir }}/compose.yaml"
        owner: root
        group: root
        mode: '0644'
      register: rtorrent_rutorrent_compose

    - name: "{{ rtorrent_rutorrent_nginx_vhost_dir }}"
      become: true
      ansible.builtin.file:
        path: "{{ rtorrent_rutorrent_nginx_vhost_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: rtorrent_rutorrent_auth_enabled | bool

    - name: Render ruTorrent nginx-proxy vhost snippets
      become: true
      ansible.builtin.template:
        src: "files/rtorrent-rutorrent/rutorrent-vhost-{{ rtorrent_rutorrent_auth_provider }}.conf.j2"
        dest: "{{ rtorrent_rutorrent_nginx_vhost_dir }}/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ rtorrent_rutorrent_web_hostnames }}"
      register: rtorrent_rutorrent_vhost
      when: rtorrent_rutorrent_auth_enabled | bool

    - name: Render ruTorrent nginx-proxy location snippets
      become: true
      ansible.builtin.template:
        src: "files/rtorrent-rutorrent/rutorrent-location-{{ rtorrent_rutorrent_auth_provider }}.conf.j2"
        dest: "{{ rtorrent_rutorrent_nginx_vhost_dir }}/{{ item }}_location"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ rtorrent_rutorrent_web_hostnames }}"
      register: rtorrent_rutorrent_vhost_location
      when: rtorrent_rutorrent_auth_enabled | bool

    - name: /etc/systemd/system/rtorrent-rutorrent.service
      become: true
      ansible.builtin.template:
        src: files/rtorrent-rutorrent.service
        dest: /etc/systemd/system/rtorrent-rutorrent.service
        owner: root
        group: root
        mode: '0644'
      when: ansible_facts['service_mgr'] == 'systemd'
      register: rtorrent_rutorrent_unit

    - name: Reload systemd
      become: true
      ansible.builtin.systemd:
        daemon_reload: true
      when: rtorrent_rutorrent_unit.changed

    - name: Restart rTorrent/ruTorrent when config changed
      become: true
      ansible.builtin.systemd:
        state: restarted
        name: rtorrent-rutorrent
      when: >
        not ansible_check_mode
        and (
          rtorrent_rutorrent_unit.changed
          or rtorrent_rutorrent_ports_env.changed
          or rtorrent_rutorrent_app_env.changed
          or (rtorrent_rutorrent_geoip_env is defined and rtorrent_rutorrent_geoip_env.changed)
          or rtorrent_rutorrent_compose.changed
          or rtorrent_rutorrent_passwd_init.changed
          or (rtorrent_rutorrent_delete_guard_script is defined and rtorrent_rutorrent_delete_guard_script.changed)
          or (rtorrent_rutorrent_completion_hook is defined and rtorrent_rutorrent_completion_hook.changed)
          or (rtorrent_rutorrent_erase_hook is defined and rtorrent_rutorrent_erase_hook.changed)
        )

    - name: Test nginx-proxy config after ruTorrent vhost changes
      become: true
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - nginx-proxy
          - nginx
          - -t
      changed_when: false
      when: >
        not ansible_check_mode
        and
        rtorrent_rutorrent_nginx_validate_on_change | default(true) | bool
        and
        rtorrent_rutorrent_auth_enabled | bool
        and (
          (rtorrent_rutorrent_vhost is defined and rtorrent_rutorrent_vhost.changed)
          or (rtorrent_rutorrent_vhost_location is defined and rtorrent_rutorrent_vhost_location.changed)
        )

    - name: Reload nginx-proxy config after ruTorrent vhost changes
      become: true
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - nginx-proxy
          - nginx
          - -s
          - reload
      when: >
        not ansible_check_mode
        and
        rtorrent_rutorrent_nginx_validate_on_change | default(true) | bool
        and
        rtorrent_rutorrent_auth_enabled | bool
        and (
          (rtorrent_rutorrent_vhost is defined and rtorrent_rutorrent_vhost.changed)
          or (rtorrent_rutorrent_vhost_location is defined and rtorrent_rutorrent_vhost_location.changed)
        )

    - name: Make sure rTorrent/ruTorrent is running
      become: true
      ansible.builtin.systemd:
        state: started
        enabled: true
        name: rtorrent-rutorrent
      when: not ansible_check_mode
