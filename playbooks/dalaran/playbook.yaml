- name: "Workstation: dalaran"
  hosts: dalaran
  tags:
    - dalaran-workstation
  tasks:
    - name: Get remote file attributes
      stat:
        path: /etc/systemd/logind.conf
      register: file_stats

    - name: Set previous attributes
      set_fact:
        previous_file_stats: "{{ file_stats }}"

- name: "Dalaran - install docker"
  ansible.builtin.import_playbook: ../docker/playbook.yaml
  vars:
    docker_hosts: dalaran
    # Dalaran runs Debian testing/forky; Docker publishes Debian packages for
    # stable suites. See readme.md.
    docker_apt_suite: trixie
  tags:
    - dalaran-docker

- name: "Dalaran - nginx proxy with letsencrypt DNS-01"
  ansible.builtin.import_playbook: ../nginx-proxy-with-letsencrypt/playbook.yaml
  vars:
    # Private values: nginx_proxy_nsupdate_server and nginx_proxy_nsupdate_zone
    # are defined in private/group_vars/dalaran.yaml. See readme.md.
    nginx_proxy_hosts: dalaran
    nginx_proxy_acme_challenge: DNS-01
    nginx_proxy_service_dir: /service/nginx-proxy
    nginx_proxy_vhost_dir: /service/nginx-proxy/vhost.d
    nginx_proxy_nsupdate_key_path: /service/nginx-proxy/nsupdate.key
    nginx_proxy_acme_env_file: /service/nginx-proxy/acme-companion.env
    nginx_proxy_dns_sleep: "60"
  tags:
    - dalaran-nginx-proxy

- name: "Dalaran - diun"
  ansible.builtin.import_playbook: ../diun/playbook.yaml
  vars:
    diun_hosts: dalaran
    diun_hostname: "{{ diun_hostnames[inventory_hostname] | default(inventory_hostname) }}"
  tags:
    - dalaran-diun

- name: "Dalaran - rTorrent/ruTorrent"
  ansible.builtin.import_playbook: ../rtorrent-rutorrent/playbook.yaml
  vars:
    rtorrent_rutorrent_hosts: dalaran
  tags:
    - dalaran-rtorrent-rutorrent

- name: "Dalaran - samba-new"
  ansible.builtin.import_playbook: ../samba-new/playbook.yaml
  vars:
    samba_new_hosts: dalaran
  tags:
    - dalaran-samba-new

- name: "Dalaran - pocket-id"
  ansible.builtin.import_playbook: ../pocket-id/playbook.yaml
  vars:
    # Private value: pocket_id_hostname is defined in private/group_vars/dalaran.yaml.
    pocket_id_hosts: dalaran
  tags:
    - dalaran-pocket-id

- name: "Dalaran - pocket-id upgrade"
  ansible.builtin.import_playbook: ../pocket-id-upgrade/playbook.yaml
  vars:
    # Private value: pocket_id_hostname is defined in private/group_vars/dalaran.yaml.
    pocket_id_hosts: dalaran
  tags:
    - never
    - dalaran-pocket-id-upgrade

- name: "Dalaran - tinyauth"
  ansible.builtin.import_playbook: ../tinyauth/playbook.yaml
  vars:
    # Private values: tinyauth_hostname, pocket_id_hostname, and beszel_hostname
    # are defined in private/group_vars/dalaran.yaml.
    tinyauth_hosts: dalaran
  tags:
    - dalaran-tinyauth

- name: "Dalaran - beszel"
  ansible.builtin.import_playbook: ../beszel/playbook.yaml
  vars:
    # Private value: beszel_hostname is defined in private/group_vars/dalaran.yaml.
    beszel_hosts: dalaran
  tags:
    - dalaran-beszel

- name: "Dalaran - beszel-agent"
  ansible.builtin.import_playbook: ../beszel-agent/playbook.yaml
  vars:
    beszel_agent_hub_host: dalaran
    beszel_agent_hub_hosts: dalaran
    beszel_agent_hosts: dalaran
  tags:
    - dalaran-beszel-agent
