- name: "Workstation: dalaran"
  hosts: dalaran
  tags:
    - dalaran-workstation
  tasks:
    - name: Get remote file attributes
      stat:
        path: /etc/systemd/logind.conf
      register: file_stats

    - name: Set previous attributes
      set_fact:
        previous_file_stats: "{{ file_stats }}"

- name: "Dalaran - install docker"
  ansible.builtin.import_playbook: ../docker/playbook.yaml
  vars:
    docker_hosts: dalaran
    # Dalaran runs Debian testing/forky; Docker publishes Debian packages for
    # stable suites. See readme.md.
    docker_apt_suite: trixie
  tags:
    - dalaran-docker

- name: "Dalaran - nginx proxy with letsencrypt DNS-01"
  ansible.builtin.import_playbook: ../nginx-proxy-with-letsencrypt/playbook.yaml
  vars:
    # Private values: nginx_proxy_nsupdate_server and nginx_proxy_nsupdate_zone
    # are defined in private/group_vars/dalaran.yaml. See readme.md.
    nginx_proxy_hosts: dalaran
    nginx_proxy_acme_challenge: DNS-01
    nginx_proxy_service_dir: /service/nginx-proxy
    nginx_proxy_vhost_dir: /service/nginx-proxy/vhost.d
    nginx_proxy_nsupdate_key_path: /service/nginx-proxy/nsupdate.key
    nginx_proxy_acme_env_file: /service/nginx-proxy/acme-companion.env
    nginx_proxy_dns_sleep: "60"
  tags:
    - dalaran-nginx-proxy

- name: "Dalaran - diun"
  ansible.builtin.import_playbook: ../diun/playbook.yaml
  vars:
    diun_hosts: dalaran
    diun_hostname: "{{ diun_hostnames[inventory_hostname] | default(inventory_hostname) }}"
  tags:
    - dalaran-diun

- name: "Dalaran - samba-new"
  ansible.builtin.import_playbook: ../samba-new/playbook.yaml
  vars:
    samba_new_hosts: dalaran
  tags:
    - dalaran-samba-new

- name: "Dalaran - pocket-id"
  ansible.builtin.import_playbook: ../pocket-id/playbook.yaml
  vars:
    # Private value: pocket_id_hostname is defined in private/group_vars/dalaran.yaml.
    pocket_id_hosts: dalaran
  tags:
    - dalaran-pocket-id

- name: "Dalaran - pocket-id upgrade"
  ansible.builtin.import_playbook: ../pocket-id-upgrade/playbook.yaml
  vars:
    # Private value: pocket_id_hostname is defined in private/group_vars/dalaran.yaml.
    pocket_id_hosts: dalaran
  tags:
    - never
    - dalaran-pocket-id-upgrade

- name: "Dalaran - remove oauth2-proxy"
  ansible.builtin.import_playbook: ../oauth2-proxy-remove/playbook.yaml
  vars:
    oauth2_proxy_remove_hosts: dalaran
    oauth2_proxy_remove_hostname: "{{ tinyauth_hostname | default(oauth2_proxy_hostname | default('')) }}"
  tags:
    - dalaran-remove-oauth2-proxy
    - dalaran-tinyauth

- name: "Dalaran - tinyauth"
  ansible.builtin.import_playbook: ../tinyauth/playbook.yaml
  vars:
    # Private values: tinyauth_hostname, pocket_id_hostname, beszel_hostname,
    # and tinyauth_image are defined in private/group_vars/dalaran.yaml.
    tinyauth_hosts: dalaran
    tinyauth_nginx_validate_on_change: false
  tags:
    - dalaran-tinyauth

- name: "Dalaran - oauth2-proxy"
  ansible.builtin.import_playbook: ../oauth2-proxy/playbook.yaml
  vars:
    # Private values: oauth2_proxy_hostname, pocket_id_hostname, and
    # oauth2_proxy_cookie_domain are defined in private/group_vars/dalaran.yaml.
    oauth2_proxy_hosts: dalaran
    oauth2_proxy_nginx_validate_on_change: false
  tags:
    - never
    - dalaran-oauth2-proxy

- name: "Dalaran - remove TinyAuth"
  ansible.builtin.import_playbook: ../tinyauth-remove/playbook.yaml
  vars:
    tinyauth_remove_hosts: dalaran
    tinyauth_remove_hostname: "{{ oauth2_proxy_hostname }}"
  tags:
    - never
    - dalaran-remove-tinyauth

- name: "Dalaran - rTorrent/ruTorrent"
  ansible.builtin.import_playbook: ../rtorrent-rutorrent/playbook.yaml
  vars:
    rtorrent_rutorrent_hosts: dalaran
    rtorrent_rutorrent_nginx_validate_on_change: false
  tags:
    - dalaran-rtorrent-rutorrent

- name: "Dalaran - beszel"
  ansible.builtin.import_playbook: ../beszel/playbook.yaml
  vars:
    # Private value: beszel_hostname is defined in private/group_vars/dalaran.yaml.
    beszel_hosts: dalaran
    beszel_nginx_validate_on_change: false
  tags:
    - dalaran-beszel

- name: "Dalaran - validate nginx proxy"
  hosts: dalaran
  tags:
    - dalaran-nginx-validate
  tasks:
    - name: Inspect TinyAuth container before final nginx-proxy validation
      become: true
      ansible.builtin.command:
        argv:
          - docker
          - container
          - inspect
          - tinyauth
      register: dalaran_tinyauth_container_inspect
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: Inspect nginx-proxy container before final nginx-proxy validation
      become: true
      ansible.builtin.command:
        argv:
          - docker
          - container
          - inspect
          - nginx-proxy
      register: dalaran_nginx_proxy_container_inspect
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: Validate TinyAuth container exists before final nginx-proxy validation
      ansible.builtin.assert:
        that:
          - dalaran_tinyauth_container_inspect.rc == 0
        fail_msg: "TinyAuth container 'tinyauth' is missing; run the dalaran-tinyauth tag or start tinyauth before final nginx-proxy validation."
      when: >
        dalaran_tinyauth_container_inspect is defined
        and
        not (dalaran_tinyauth_container_inspect.skipped | default(false))

    - name: Validate nginx-proxy container exists before final nginx-proxy validation
      ansible.builtin.assert:
        that:
          - dalaran_nginx_proxy_container_inspect.rc == 0
        fail_msg: "nginx-proxy container is missing; start nginx-proxy before final nginx-proxy validation."
      when: >
        dalaran_nginx_proxy_container_inspect is defined
        and
        not (dalaran_nginx_proxy_container_inspect.skipped | default(false))

    - name: Read TinyAuth container state before final nginx-proxy validation
      ansible.builtin.set_fact:
        dalaran_tinyauth_container_state: "{{ dalaran_tinyauth_container_inspect.stdout | from_json | first }}"
      when: >
        dalaran_tinyauth_container_inspect is defined
        and
        not (dalaran_tinyauth_container_inspect.skipped | default(false))
        and
        dalaran_tinyauth_container_inspect.rc == 0

    - name: Read nginx-proxy container state before final nginx-proxy validation
      ansible.builtin.set_fact:
        dalaran_nginx_proxy_container_state: "{{ dalaran_nginx_proxy_container_inspect.stdout | from_json | first }}"
      when: >
        dalaran_nginx_proxy_container_inspect is defined
        and
        not (dalaran_nginx_proxy_container_inspect.skipped | default(false))
        and
        dalaran_nginx_proxy_container_inspect.rc == 0

    - name: Read TinyAuth logs before final nginx-proxy validation
      become: true
      ansible.builtin.shell:
        cmd: docker logs --tail=80 tinyauth 2>&1 || true
      register: dalaran_tinyauth_container_logs
      changed_when: false
      failed_when: false
      when: dalaran_tinyauth_container_state is defined

    - name: Validate TinyAuth is stable and nginx-proxy shares the webservers network before final nginx-proxy validation
      ansible.builtin.assert:
        that:
          - dalaran_tinyauth_container_state.State.Status == 'running'
          - dalaran_tinyauth_container_state.State.Running | bool
          - not (dalaran_tinyauth_container_state.State.Restarting | default(false) | bool)
          - dalaran_nginx_proxy_container_state.State.Status == 'running'
          - dalaran_nginx_proxy_container_state.State.Running | bool
          - "'webservers' in (dalaran_tinyauth_container_state.NetworkSettings.Networks | default({}))"
          - "'webservers' in (dalaran_nginx_proxy_container_state.NetworkSettings.Networks | default({}))"
          - "'tinyauth' in (dalaran_tinyauth_container_state.NetworkSettings.Networks.webservers.Aliases | default([]))"
        fail_msg: |-
          TinyAuth container 'tinyauth' and nginx-proxy must both be stable and attached to Docker network 'webservers' before final nginx-proxy validation.
          tinyauth_status={{ dalaran_tinyauth_container_state.State.Status | default('unknown') }}
          tinyauth_restarting={{ dalaran_tinyauth_container_state.State.Restarting | default('unknown') }}
          tinyauth_exit_code={{ dalaran_tinyauth_container_state.State.ExitCode | default('unknown') }}
          tinyauth_error={{ dalaran_tinyauth_container_state.State.Error | default('') }}
          nginx_proxy_status={{ dalaran_nginx_proxy_container_state.State.Status | default('unknown') }}
          tinyauth_logs:
          {{ dalaran_tinyauth_container_logs.stdout | default('') }}
      when: >
        dalaran_tinyauth_container_state is defined
        and
        dalaran_nginx_proxy_container_state is defined

    - name: Check nginx-proxy can resolve TinyAuth through Docker DNS before final nginx-proxy validation
      become: true
      ansible.builtin.shell:
        cmd: |
          docker exec nginx-proxy sh -c '
            printf "command="
            command -v getent || true
            printf "\nresolv.conf:\n"
            cat /etc/resolv.conf
            printf "\nlookup:\n"
            getent hosts tinyauth
          '
      register: dalaran_tinyauth_dns_lookup
      changed_when: false
      failed_when: false
      retries: 3
      delay: 2
      until: dalaran_tinyauth_dns_lookup.rc == 0
      when: not ansible_check_mode

    - name: Validate nginx-proxy can resolve TinyAuth before final nginx-proxy validation
      ansible.builtin.assert:
        that:
          - dalaran_tinyauth_dns_lookup.rc == 0
        fail_msg: |-
          nginx-proxy cannot resolve 'tinyauth' through Docker DNS.
          rc={{ dalaran_tinyauth_dns_lookup.rc }}
          stdout:
          {{ dalaran_tinyauth_dns_lookup.stdout | default('') }}
          stderr:
          {{ dalaran_tinyauth_dns_lookup.stderr | default('') }}
          tinyauth_logs:
          {{ dalaran_tinyauth_container_logs.stdout | default('') }}
      when: >
        dalaran_tinyauth_dns_lookup is defined
        and
        not (dalaran_tinyauth_dns_lookup.skipped | default(false))

    - name: Test nginx-proxy config after Dalaran vhost changes
      become: true
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - nginx-proxy
          - nginx
          - -t
      changed_when: false
      when: not ansible_check_mode

    - name: Reload nginx-proxy config after Dalaran vhost changes
      become: true
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - nginx-proxy
          - nginx
          - -s
          - reload
      when: not ansible_check_mode

- name: "Dalaran - beszel-agent"
  ansible.builtin.import_playbook: ../beszel-agent/playbook.yaml
  vars:
    beszel_agent_hub_host: dalaran
    beszel_agent_hub_hosts: dalaran
    beszel_agent_hosts: dalaran
  tags:
    - dalaran-beszel-agent
