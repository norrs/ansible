---
- import_playbook: ../docker/playbook.yaml
  vars:
    docker_hosts: cloud

- import_playbook: ../wireguard-client/playbook.yaml
  vars:
    wireguard_client_hosts: cloud
    wireguard_client_server_op_item: wireguard/dune/server/monitoring
    wireguard_client_peer_op_item: wireguard/dune/peers/monitoring/diablo

- name: Bootstrap
  hosts: cloud
  tasks:
  - name: "Private hosts entries"
    become: true
    ansible.builtin.lineinfile:
      path: /etc/hosts
      regexp: "{{ item.regexp }}"
      line: "{{ item.line }}"
      owner: root
      group: root
      mode: '0644'
    loop: "{{ diablo_hosts_entries | default([]) }}"
    no_log: true

  - name: "/etc/network/interfaces.d/51-diablo"
    become: true
    ansible.builtin.copy:
      src: ./files/etc/network/interfaces.d/51-diablo
      dest: /etc/network/interfaces.d/51-diablo
      owner: root
      group: root
      mode: '0644'

  - name: "Disable cloud network configuration"
    become: true
    ansible.builtin.copy:
      content: "network: {config: disabled}"
      dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
      owner: root
      group: root
      mode: '0644'

  - name: "/etc/dhcp/dhclient.conf"
    become: true
    ansible.builtin.copy:
      src: ./files/etc/dhcp/dhclient.conf
      dest: /etc/dhcp/dhclient.conf
      owner: root
      group: root
      mode: '0644'

- import_playbook: ../beszel-agent/playbook.yaml
  vars:
    beszel_agent_hub_host: dalaran
    beszel_agent_hub_hosts: dalaran
    beszel_agent_hosts: cloud
    beszel_agent_hub_url: "{{ diablo_beszel_agent_hub_url }}"
    beszel_agent_system_name: "{{ diablo_beszel_agent_system_name }}"
    beszel_agent_disable_ssh: true
    beszel_agent_systemd_wants:
      - wg-quick@wg-monitoring.service
    beszel_agent_systemd_after:
      - wg-quick@wg-monitoring.service

- import_playbook: ../mailserver/playbook.yaml
- import_playbook: ../nginx-proxy-with-letsencrypt/playbook.yaml
- import_playbook: ../webserver/diablo.norrs.no/playbook.yaml
- import_playbook: ../webserver/norrs.no/playbook.yaml
- import_playbook: ../webmail/playbook.yaml
